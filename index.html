<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçe Dünyası</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            margin-bottom: 5px;
        }
        .authors {
            font-style: italic;
            color: #666;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
            vertical-align: top;
        }
        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .caption {
            font-size: 0.85em;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>Türkçe Dünyası</h1>
        <p>Türkçe ödevim için web sitem</p>
        <p class="authors">Musab Kerim Koç ve Çağan İnanç Öztürk</p>
    </header>

    <main>
        <section>
            <h2>Mustafa Kemal Atatürk</h2>
            <table>
                <thead>
                    <tr>
                        <th>1917, Halep</th>
                        <th>Yaklaşık 1918</th>
                        <th>1921</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <a href="https://commons.wikimedia.org/wiki/File:General_Mustafa_Kemal_in_Aleppo,_1917.png" target="_blank">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/General_Mustafa_Kemal_in_Aleppo%2C_1917.png" width="220" alt="Mustafa Kemal, Halep'te, 1917">
                            </a>
                        </td>
                        <td>
                            <a href="https://commons.wikimedia.org/wiki/File:Kemal_Atat%C3%BCrk_portrait.jpg" target="_blank">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Kemal_Atat%C3%BCrk_portrait.jpg" width="220" alt="Mustafa Kemal'in yaklaşık 1918 tarihli portresi">
                            </a>
                        </td>
                        <td>
                            <a href="https://commons.wikimedia.org/wiki/File:Mustafa_Kemal_Atat%C3%BCrk_1921.jpg" target="_blank">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/9/99/Mustafa_Kemal_Atat%C3%BCrk_1921.jpg" width="220" alt="Mustafa Kemal Atatürk, 1921">
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td class="caption">Kaynak: Wikimedia Commons, kamu malı</td>
                        <td class="caption">Kaynak: Wikimedia Commons, kamu malı</td>
                        <td class="caption">Fotoğraf: TYalaA, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank">CC BY-SA 4.0</a>, <a href="https://commons.wikimedia.org/wiki/File:Mustafa_Kemal_Atat%C3%BCrk_1921.jpg" target="_blank">Wikimedia Commons</a></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
